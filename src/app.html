<!doctype html>
<html lang="en" data-theme="catppuccin" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#11111b" />
    <title>Furu</title>
    <!--
      Resolve the colour mode before first paint so a stored preference never
      flashes the wrong palette. The inline script only reads a mirror written
      by the app settings store; SvelteKit cannot run before paint.
    -->
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("furu:themeMode");
          if (mode === "light" || mode === "dark") {
            document.documentElement.dataset.mode = mode;
            return;
          }
          if (mode === "system") {
            document.documentElement.dataset.mode = window.matchMedia(
              "(prefers-color-scheme: light)",
            ).matches
              ? "light"
              : "dark";
          }
        } catch {
          /* Private mode or a disabled store: keep the Mocha default. */
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
