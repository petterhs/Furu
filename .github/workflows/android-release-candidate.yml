name: Android builds and releases

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main for release policy
        if: github.event_name == 'push'
        run: git fetch origin main
      - name: Require main for manual signed builds
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Validate signed release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare-release.py "$RELEASE_TAG" --validate-only
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend
        run: pnpm check
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'Missing secret ANDROID_KEYSTORE_BASE64' >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/furu-upload.keystore"
      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/furu-upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm tauri android build --target aarch64 --ci
      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: furu-signed-${{ github.ref_name }}-${{ github.sha }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
      - name: Install changelog generator
        if: github.event_name == 'push'
        run: cargo install git-cliff --version 2.12.0 --locked
      - name: Prepare tagged release
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/prepare-release.py "$RELEASE_TAG"
          bash scripts/release-notes.sh "$RELEASE_TAG" dist/CHANGELOG.md
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            *-rc.*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$RELEASE_TAG" dist/furu-"$RELEASE_TAG"-android-arm64.apk dist/furu-"$RELEASE_TAG"-android-arm64.aab dist/SHA256SUMS dist/CHANGELOG.md --verify-tag --title "Furu $RELEASE_TAG" --notes-file dist/CHANGELOG.md $prerelease
