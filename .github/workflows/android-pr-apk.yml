name: Android PR APK

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - run: pnpm install --frozen-lockfile
      - name: Build Furu Dev APK
        run: pnpm tauri android build --debug --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: furu-dev-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
